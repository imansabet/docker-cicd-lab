<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Movies</title></head>
<body>
  <h1>Movies</h1>
  <form id="f">
    <input id="title" placeholder="Title" required>
    <input id="year" type="number" placeholder="Year" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    async function load() {
      const r = await fetch('/api/movies');
      const items = await r.json();
      list.innerHTML = items.map(m => `<li>${m.title} (${m.year})</li>`).join('');
    }
    f.onsubmit = async e => {
      e.preventDefault();
      await fetch('/api/movies', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: title.value, year: +year.value})
      });
      f.reset(); load();
    };
    load();
  </script>
</body>
</html>

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app
      - run: pytest backend/tests -v
        working-directory: .
        env:
          PYTHONPATH: backend

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build --target prod -t ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-backend:${{ steps.vars.outputs.tag }} ./backend
          docker build -t ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-frontend:${{ steps.vars.outputs.tag }} ./frontend
      - name: Scan images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-backend:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          timeout: 15m0s
          exit-code: 0
      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-backend:${{ steps.vars.outputs.tag }}
          docker push ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-frontend:${{ steps.vars.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy new version
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          sed -i "s|build:.*|image: ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-backend:${TAG}|" /tmp/unused || true
          docker pull ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-backend:${TAG}
          docker pull ghcr.io/${{ github.repository_owner }}/docker-cicd-lab-frontend:${TAG}
          cd ~/docker-cicd-lab
          BACKEND_TAG=$TAG FRONTEND_TAG=$TAG docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
      - name: Health check
        run: |
          sleep 8
          curl -f http://localhost:8090/health

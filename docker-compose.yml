services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      MONGO_URL: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGO_DB: ${MONGO_DB}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [frontend-net, backend-net]
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend-net]
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  frontend-net:
  backend-net:

volumes:
  mongo-data:
